<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis mascotas</title>
    <link rel="stylesheet" href="css/estilo.css"
</head>

<body> 


    <header>
        <a href="index.html" title="Vuelve al inicio">
        <h1 id="titulo">Mis mascotas</h1>
        <p>Conoced a nuestros gatos, perros y aves.</p>
    </header>

    <main>
<figure id="luna" class="gato">
                <img
                    src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600"
                    alt="Gato llamado Luna"
                >
                <figcaption>
                    <h3>Luna</h3>
                    <p>Una gata tranquila y curiosa.</p>
                </figcaption>
            </figure>


            <figure id="simba" class="gato">
                <img
                    src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=600"
                    alt="Gato llamado Simba"
                >
                <figcaption>
                    <h3>Simba</h3>
                    <p>Un gato juguetón y muy cariñoso.</p>
                </figcaption>
            </figure>

   
         

            <figure id="toby" class="perro">
                <img
                    src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
                    alt="Perro llamado Toby"
                >
                <figcaption>
                    <h3>Toby</h3>
                    <p>Un perro alegre al que le encanta correr.</p>
                </figcaption>
            </figure>

            <figure id="nala" class="perro">
                <img
                    src="https://images.unsplash.com/photo-1558788353-f76d92427f16?w=600"
                    alt="Perra llamada Nala"
                >
                <figcaption>
                    <h3>Nala</h3>
                    <p>Una perra tranquila y muy cariñosa.</p>
                </figcaption>
            </figure>
            <figure id="kiwi" class="ave">
                <img
                    src="https://images.unsplash.com/photo-1452570053594-1b985d6ea890?w=600"
                    alt="Ave llamado Kiwi"
                >
                <figcaption>
                    <h3>Kiwi</h3>
                    <p>Un pequeño papagayo lleno de energía.</p>
                </figcaption>
            </figure>

            <figure id="coco" class="ave">
                <img
                    src="https://images.unsplash.com/photo-1444464666168-49d633b86797?w=600"
                    alt="Ave llamado Coco"
                >
                <figcaption>
                    <h3>Coco</h3>
                    <p>Un martin pescador curioso y muy sociable.</p>
                </figcaption>
            </figure>
</main>

    <footer>
        <p>© 2026 Mis mascotas</p>
    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon por tipo</title>
    <link rel="stylesheet" href="css/estilos.css">

</head>
<body>
    <header>
        <h1>Pokémon por tipo</h1>
        <p>Doce Pokémon obtenidos de la PokéAPI, tres de cada tipo</p>
    </header>
    <main id="contenedor">
        <section id="fire">
        <figure class="fire" id="charmander">
            <img
                src="img/4.jpg"
                alt="charmander">
            <figcaption>
                <strong>charmander</strong>
                <span>Fuego</span>
            </figcaption>
        </figure>
        <figure class="fire" id="charmeleon">
            <img
                src="img/5.png"
                alt="charmeleon">
            <figcaption>
                <strong>charmeleon</strong>
                <span>Fuego</span>
            </figcaption>
        </figure>
        <figure class="fire" id="charizard">
            <img
                src="img/6.png"
                alt="charizard">
            <figcaption>
                <strong>charizard</strong>
                <span>Fuego</span>
            </figcaption>
        </figure>
    </section>
    <section id="water">
        <figure class="water" id="squirtle">
            <img
                src="img/7.png"
                alt="squirtle">
            <figcaption>
                <strong>squirtle</strong>
                <span>Agua</span>
            </figcaption>
        </figure>
        <figure class="water" id="wartortle">
            <img
                src="img/8.png"
                alt="wartortle">
            <figcaption>
                <strong>wartortle</strong>
                <span>Agua</span>
            </figcaption>
        </figure>
        
        <figure class="water" id="blastoise">
            <img
                src="img/9.png"
                alt="blastoise">
            <figcaption>
                <strong>blastoise</strong>
                <span>Agua</span>
            </figcaption>
        </figure>
        </section>
        <section id="grass">
        <figure class="grass" id="bulbasaur">
            <img
                src="img/1.png"
                alt="bulbasaur">
            <figcaption>
                <strong>bulbasaur</strong>
                <span>Planta</span>
            </figcaption>
        </figure>
        <figure class="grass" id="ivysaur">
            <img
                src="img/2.png"
                alt="ivysaur">
            <figcaption>
                <strong>ivysaur</strong>
                <span>Planta</span>
            </figcaption>
        </figure>
        <figure class="grass" id="venusaur">
            <img
                src="img/3.png"
                alt="venusaur">
            <figcaption>
                <strong>venusaur</strong>
                <span>Planta</span>
            </figcaption>
        </figure>
        </section>
        <section id="electric">
        <figure class="electric" id="pikachu">
            <img
                src="img/25.png"
                alt="pikachu">
            <figcaption>
                <strong>pikachu</strong>
                <span>Eléctrico</span>
            </figcaption>
        </figure>
        <figure class="electric" id="raichu">
            <img
                src="img/26.png"
                alt="raichu">
            <figcaption>
                <strong>raichu</strong>
                <span>Eléctrico</span>
            </figcaption>
        </figure>
        <figure class="electric" id="magnemite">
            <img
                src="img/81.png"
                alt="magnemite">
            <figcaption>
                <strong>magnemite</strong>
                <span>Eléctrico</span>
            </figcaption>
        </figure>
        </section>
    </main>
</body>
</html>
